name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # TEMPORARIO — validando o gatilho `schedule`, que nunca executou. Volta para
  # '0 6 * * *' (03:00 em Sao Paulo) assim que a execucao provar o recorte `test:nightly`.
  #
  # O horario definitivo e deliberado: a noturna e a UNICA que roda os cenarios `@slow`
  # (concorrencia), e falhar de madrugada da o dia inteiro para investigar.
  schedule:
    - cron: '20 18 * * *'
  # Permite disparar manualmente pela aba Actions.
  workflow_dispatch:

# Um push novo na mesma branch cancela a execucao anterior: nao ha valor em
# terminar o CI de um commit que ja foi substituido.
#
# `schedule` fica FORA do agrupamento por ref: a execucao noturna e da main, e cancelar a
# de ontem porque a de hoje comecou seria correto — mas cancelar a noturna porque alguem
# fez um push na main nao seria.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Job rapido e barato. Roda em paralelo com os demais para dar retorno em segundos,
  # em vez de esperar o browser subir para descobrir um erro de tipo.
  quality:
    name: Lint, tipos e testes unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Cacheia o diretorio do npm usando os dois lockfiles como chave.
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            automation/package-lock.json

      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar dependencias da automacao
        working-directory: automation
        run: npm ci

      - name: Lint do frontend
        working-directory: frontend
        run: npm run lint

      - name: Formatacao do frontend
        working-directory: frontend
        run: npm run format:check

      - name: Lint da automacao
        working-directory: automation
        run: npm run lint

      - name: Formatacao da automacao
        working-directory: automation
        run: npm run format:check

      - name: Checagem de tipos da automacao
        working-directory: automation
        run: npm run typecheck

      - name: Testes unitarios
        working-directory: frontend
        run: npm run test:unit

  # A API tem job proprio porque precisa de um servico que os outros nao usam: um Postgres
  # de verdade. Rodar isso dentro do job `quality` faria toda checagem de lint do frontend
  # esperar um banco subir.
  api:
    name: API (lint, tipos, migrations e seed)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techstore
          POSTGRES_PASSWORD: techstore
          POSTGRES_DB: techstore
        ports:
          - 5432:5432
        # Sem o healthcheck, os passos comecam assim que o CONTAINER sobe — e o Postgres
        # ainda leva alguns segundos ate aceitar conexao. E a origem classica do
        # "falhou uma vez, passou no retry".
        options: >-
          --health-cmd "pg_isready -U techstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://techstore:techstore@localhost:5432/techstore?schema=public
      NODE_ENV: test
      PORT: '3000'
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      LOG_LEVEL: warn
      # 10 e nao 12: cada login custa um hash, e a suite de API faz dezenas deles.
      # O custo alto protege senha real em producao, nao massa de teste descartavel.
      BCRYPT_ROUNDS: '10'
      JWT_ACCESS_SECRET: ci-secret-com-mais-de-32-caracteres-para-validacao
      JWT_ACCESS_TTL_SECONDS: '900'
      REFRESH_TOKEN_TTL_DAYS: '7'
      THROTTLE_TTL: '60000'
      # Limite alto: um rate limit apertado reprovaria a suite inteira, que dispara
      # requisicoes em paralelo de um unico endereco.
      THROTTLE_LIMIT: '10000'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependencias
        working-directory: api
        run: npm ci

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Formatacao
        working-directory: api
        run: npm run format:check

      - name: Checagem de tipos
        working-directory: api
        run: npm run typecheck

      - name: Build
        working-directory: api
        run: npm run build

      # `migrate deploy` e nao `migrate dev`: aplica o que esta versionado e nunca gera
      # migration nova. Se o schema divergir das migrations, este passo FALHA — que e
      # exatamente o que se quer descobrir no CI, e nao em producao.
      - name: Aplicar migrations
        working-directory: api
        run: npm run prisma:deploy

      - name: Executar seed
        working-directory: api
        run: npm run db:seed

      # Prova que a aplicacao sobe de verdade contra o banco. Um build que compila mas nao
      # inicia (injecao de dependencia quebrada, variavel faltando) passaria em todos os
      # passos anteriores.
      - name: Subir a API e verificar readiness
        working-directory: api
        run: |
          node dist/main.js & echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health/ready > /dev/null; then
              echo "API pronta:"
              curl -s http://localhost:3000/api/health/ready
              echo
              # A especificacao so existe com a aplicacao no ar — ela e gerada em runtime
              # a partir dos DTOs. Capturada aqui, vira artefato versionavel: da para
              # comparar a spec de um PR com a da main e ver a mudanca de contrato.
              curl -s http://localhost:3000/api/docs-json -o openapi.json
              kill "$(cat /tmp/api.pid)"
              exit 0
            fi
            sleep 1
          done
          echo "A API nao ficou pronta em 30s"
          kill "$(cat /tmp/api.pid)" || true
          exit 1

      - name: Publicar especificacao OpenAPI
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openapi-spec
          path: api/openapi.json
          retention-days: 14

  test:
    name: Suite de testes (${{ github.event_name == 'pull_request' && 'gate de PR' || github.event_name == 'schedule' && 'noturna completa' || 'regressao' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A pilha inteira sobe UMA vez e as tres suites rodam sobre ela.
    #
    # A alternativa — um job por suite — parecia mais limpa e e mais cara: cada job
    # repetiria `npm ci` de tres projetos, migrations, seed e o boot da API. Medido
    # localmente, os testes levam 4,5 min e o preparo do ambiente leva o mesmo tanto;
    # triplicar o preparo para paralelizar 4,5 min de teste nao se paga nesta escala.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techstore
          POSTGRES_PASSWORD: techstore
          POSTGRES_DB: techstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://techstore:techstore@localhost:5432/techstore?schema=public
      # `test` e nao `production`: e o que mantem `POST /test/reset` registrado. Em
      # producao o modulo nao existe, e a suite nao teria como isolar os cenarios.
      NODE_ENV: test
      PORT: '3000'
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      LOG_LEVEL: warn
      BCRYPT_ROUNDS: '10'
      JWT_ACCESS_SECRET: ci-secret-com-mais-de-32-caracteres-para-validacao
      JWT_ACCESS_TTL_SECONDS: '900'
      REFRESH_TOKEN_TTL_DAYS: '7'
      THROTTLE_TTL: '60000'
      # Alto de proposito: a suite dispara dezenas de requisicoes de um unico endereco.
      # Um limite de producao reprovaria os testes por excesso de zelo.
      THROTTLE_LIMIT: '10000'
      VITE_API_URL: http://localhost:3000/api/v1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            automation/package-lock.json

      # O recorte da suite e escolhido pelo GATILHO, e cada opcao e um script que qualquer
      # pessoa roda igual na propria maquina. E o ponto: o pipeline nao tem um comando
      # secreto que so existe no YAML — reproduzir a falha do CI e copiar uma linha.
      #
      #   pull_request  test:pr          @smoke + @critical (43 cenarios, ~55 s)
      #   push (main)   test:regression  tudo menos @slow  (159 cenarios, ~4,5 min)
      #   schedule      test:nightly     tudo, inclusive @slow
      #
      # Por que o PR nao roda tudo: medido, o recorte leva 55 s contra 4,5 min. Mas o
      # ganho maior nao e tempo — e a AUTORIDADE do gate. Todo teste no caminho do merge
      # multiplica a chance de vermelho sem relacao com a mudanca, e um gate que erra e um
      # gate que as pessoas aprendem a ignorar.
      #
      # `@slow` fica so na noturna porque concorrencia e barulhenta por natureza: ela
      # merece existir, e nao merece bloquear um merge.
      - name: Selecionar o recorte da suite
        id: suite
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "script=test:pr" >> "$GITHUB_OUTPUT" ;;
            schedule)     echo "script=test:nightly" >> "$GITHUB_OUTPUT" ;;
            *)            echo "script=test:regression" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar dependencias da automacao
        working-directory: automation
        run: npm ci

      - name: Instalar dependencias da API
        working-directory: api
        run: npm ci

      # Os binarios do browser (~150 MB) sao cacheados pela versao do Playwright
      # declarada no lockfile: sem isso, cada execucao baixaria tudo de novo.
      - name: Ler versao do Playwright
        id: playwright
        working-directory: automation
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restaurar cache dos browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: automation
        run: npx playwright install --with-deps chromium

      # Mesmo com cache do browser, as dependencias de sistema precisam existir.
      - name: Instalar dependencias de sistema do browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: automation
        run: npx playwright install-deps chromium

      - name: Preparar o banco
        working-directory: api
        run: |
          npm run prisma:deploy
          npm run db:seed

      # A API guarda o log em arquivo para que o passo de diagnostico consiga recupera-lo.
      # Sem isso, um teste vermelho no CI perde justamente a informacao que o `x-request-id`
      # da suite existe para correlacionar.
      - name: Subir a API
        working-directory: api
        run: |
          npm run build
          node dist/main.js > /tmp/api.log 2>&1 & echo $! > /tmp/api.pid
          # Espera a PRONTIDAO real (banco conectado), nao apenas a porta abrir. Sem isso,
          # o primeiro teste bate numa API que ainda esta inicializando.
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health/ready > /dev/null && exit 0
            sleep 1
          done
          echo "API nao ficou pronta"; cat /tmp/api.log; exit 1

      # O `webServer` do Playwright roda `npm run preview` quando CI=true.
      # O build precisa existir antes: construir aqui deixa a falha de build separada
      # da falha de teste, em vez de mascarada dentro do log do webServer.
      #
      # Embute VITE_API_URL: precisa acontecer DEPOIS de a variavel existir e ANTES do
      # preview que a suite consome.
      - name: Build da aplicacao
        working-directory: frontend
        run: npm run build

      - name: Executar a suite
        working-directory: automation
        run: npm run ${{ steps.suite.outputs.script }}

      - name: Log da API em caso de falha
        if: failure()
        run: tail -200 /tmp/api.log || true

      # `always()`: o relatorio e MAIS util quando a suite falha. Sem isso, o artifact
      # so existiria nas execucoes verdes, que sao justamente as que nao precisam dele.
      - name: Publicar HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.event_name }}
          path: automation/reports/html
          retention-days: 14

      - name: Publicar resultados JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results-${{ github.event_name }}
          path: automation/reports/junit
          retention-days: 14

      # Traces, videos e screenshots so existem quando algo falhou. Para os cenarios de
      # API e contrato, o que vem aqui e o registro requisicao/resposta com o
      # `x-request-id` — a moeda de evidencia de quem nao tem navegador.
      - name: Publicar evidencias de falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-de-falha-${{ github.event_name }}
          path: automation/test-results
          retention-days: 14
